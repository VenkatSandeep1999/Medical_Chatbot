<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Medical Chatbot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="chat-container">
    
    <!-- Header -->
    <div class="chat-header">
        <img src="https://cdn-icons-png.flaticon.com/512/3774/3774299.png" class="avatar">
        <div>
            <h2>Medical Chatbot</h2>
            <p>Ask me anything!</p>
        </div>
    </div>

    <!-- Chat Area -->
    <div class="chat-box" id="chatBox">
        <div class="bot-message">Hello 👋 How can I help you?</div>
    </div>

    <!-- Input -->
    <div class="chat-input">
        <input type="text" id="userInput" placeholder="Type your message...">
        <button onclick="sendMessage()">➤</button>
    </div>

</div>

<script>
function sendMessage() {
    let input = document.getElementById("userInput");
    let message = input.value.trim();
    if (!message) return;

    let chatBox = document.getElementById("chatBox");

    // User message
    let userMsg = document.createElement("div");
    userMsg.className = "user-message";
    userMsg.innerText = message;
    chatBox.appendChild(userMsg);

    // Bot placeholder
    let botMsg = document.createElement("div");
    botMsg.className = "bot-message";
    botMsg.innerText = "Processing your request...";
    chatBox.appendChild(botMsg);

    // 🔥 IMPORTANT FIX (FormData)
    let formData = new FormData();
    formData.append("msg", message);

    fetch("/get", {
        method: "POST",
        body: formData
    })
    .then(response => response.text())
    .then(data => {
        botMsg.innerText = data;
    })
    .catch(error => {
        botMsg.innerText = "Error: " + error;
    });

    input.value = "";
    chatBox.scrollTop = chatBox.scrollHeight;
}
</script>

</body>
</html>
